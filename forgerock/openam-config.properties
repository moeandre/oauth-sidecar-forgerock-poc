# Propriedades de instalação silenciosa do OpenAM (fork open-source do
# ForgeRock Access Management usado nesta PoC - ver README, secao 0).
# Consumidas pelo openam-configurator-tool em openam-entrypoint.sh.
#
# Nao versione senhas reais aqui: estes sao valores de dev, iguais aos que
# forgerock/provision.sh e o docker-compose.yml esperam encontrar.

SERVER_URL=http://openam:8080
DEPLOYMENT_URI=/openam
BASE_DIR=/usr/openam/config
locale=en_US
PLATFORM_LOCALE=en_US
AM_ENC_KEY=
# Senha do usuario admin (amadmin). Precisa ter pelo menos 8 caracteres e
# ser DIFERENTE de AMLDAPUSERPASSWD (o configurador rejeita se forem iguais).
ADMIN_PWD=ChangeMe123!
# Senha do agent tecnico interno (UrlAccessAgent) usado pelo proprio AM -
# nao e uma credencial de usuario final, so precisa ser distinta da ADMIN_PWD.
AMLDAPUSERPASSWD=UrlAccessAgent1!
COOKIE_DOMAIN=openam
ACCEPT_LICENSES=true

# DATA_STORE=embedded: o proprio OpenAM sobe seu OpenDJ embutido dentro do
# container (sem precisar de um segundo container/servico so para isso) -
# mesma logica de simplificacao do H2 em memoria no crud-service/billing-service.
DATA_STORE=embedded
DIRECTORY_SSL=SIMPLE
DIRECTORY_SERVER=localhost
DIRECTORY_PORT=50389
DIRECTORY_ADMIN_PORT=4444
DIRECTORY_JMX_PORT=1689
ROOT_SUFFIX=dc=openam,dc=forgerock,dc=org
DS_DIRMGRDN=cn=Directory Manager
DS_DIRMGRPASSWD=ChangeMe123!
