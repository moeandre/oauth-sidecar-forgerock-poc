server:
  port: 8082
  #tunning no tomcat
  # OBS: com spring.threads.virtual.enabled=true (abaixo), o conector do
  # Tomcat passa a usar um executor de thread virtual, e "threads.max"/
  # "min-spare" (que configuram o pool de threads PLATAFORMA) deixam de ter
  # efeito pratico - quem ainda vale e "accept-count" (fila de conexoes
  # aguardando aceitar) e "max-connections" (teto de conexoes simultaneas),
  # que atuam no nivel de socket/conexao, nao de thread. Mantidos aqui como
  # documentacao/fallback caso as threads virtuais sejam desligadas depois.
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    max-connections: 8192
  servlet:
    session:
      # Explicito para nao depender do default do Tomcat (30min): sessao
      # guarda os OAuth2AuthorizedClient (um por client-registration/rota) em
      # memoria - sem um teto razoavel, sessoes esquecidas se acumulam e
      # crescem o heap. Ajuste conforme o uso real (tempo entre requisicoes
      # de um usuario legitimo).
      timeout: 30m

spring:
  application:
    name: oauth-sidecar
  security:
    oauth2:
      client:
        registration:
          # Um client-id por microservico, cada um com seus proprios escopos
          # (ver README, secao "Pre-requisito: o que precisa existir no seu
          # ForgeRock AM/PingAM"). "write"/"read" nao entram aqui de
          # proposito: cada client so pede o escopo "*-read" (silencioso,
          # default) de antemao; "*-write" so e solicitado no momento do
          # step-up (ver StepUpAuthorizationRequestResolver e ProxyController),
          # para o AM so exibir o escopo que realmente esta sendo pedido
          # naquele momento, e nao sempre.
          #
          # Esta PoC NAO sobe um ForgeRock AM/PingAM proprio: aponta para uma
          # instancia ja existente (sua ou da sua organizacao). Sem default
          # de dev aqui de proposito (nao tem "${VAR:default}") - client-id/
          # secret/issuer-uri sao obrigatorios via variavel de ambiente; sem
          # eles a app falha rapido no boot (erro claro de placeholder nao
          # resolvido), em vez de conectar silenciosamente num destino
          # errado. O docker-compose.yml ja reforca isso com "${VAR:?...}".
          tasks-client:
            provider: forgerock
            client-id: ${TASKS_CLIENT_ID:tasks-client}
            client-secret: ${TASKS_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid,task:read
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          billing-client:
            provider: forgerock
            client-id: ${BILLING_CLIENT_ID:billing-client}
            client-secret: ${BILLING_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid,billing:read
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          forgerock:
            # URL do discovery document ("/.well-known/openid-configuration"
            # e resolvido a partir daqui) do SEU realm no ForgeRock AM/PingAM,
            # ex.: https://openam.example.com/am/oauth2/realms/root/realms/poc-realm
            # (self-hosted AM) ou o equivalente do seu tenant PingAM/Identity
            # Cloud. Ver README para o passo a passo de como descobrir esse
            # valor certo no seu ambiente.
            issuer-uri: ${FORGEROCK_ISSUER_URI}
  #habilita thread cirtuais
  threads:
    virtual:
      enabled: true
  #limita conexões http por padrão
  http:
    client:
      connect-timeout: 2s
      read-timeout: 3s

sidecar:
  # Tabela de roteamento: path protegido -> backend -> client OAuth2 (client-id
  # proprio do microservico) -> politica de escopo por verbo HTTP. Nada disso
  # esta em codigo (ver SidecarProperties/ProxyController); adicionar um novo
  # componente atras do sidecar e so acrescentar uma entrada aqui (e o client
  # correspondente em spring.security.oauth2.client.registration acima, e no
  # seu ForgeRock AM/PingAM - ver README) - ou sobrescrever via variavel de
  # ambiente, ex.: SIDECAR_ROUTES_0_SCOPES_MAPPING_GET=task:read.
  routes:
    - path: /api/tasks
      backend-base-url: http://crud-service:8081
      client-registration-id: tasks-client
      scopes:
        # Escopo exigido quando o metodo HTTP nao aparece no mapa abaixo.
        default-scope: task:write
        mapping:
          GET: task:read
          HEAD: task:read
          POST: task:write
          PUT: task:write
          PATCH: task:write
          DELETE: task:write
    - path: /api/billing
      backend-base-url: http://billing-service:8083
      client-registration-id: billing-client
      scopes:
        default-scope: billing:write
        mapping:
          GET: billing:read
          HEAD: billing:read
          POST: billing:write
          PUT: billing:write
          PATCH: billing:write
          DELETE: billing:write

management:
  # Porta separada (nao publicada no docker-compose, igual crud-service e
  # billing-service) para health/metrics/prometheus: assim eles nao competem
  # com o SecurityFilterChain de negocio (que exige login OAuth2) nem ficam
  # expostos publicamente na 8082 so porque alguem quer fazer scraping. Um
  # scraper de metricas nao sabe fazer login OAuth2 interativo.
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true

logging:
  level:
    # INFO por padrao (prod-safe: DEBUG deste pacote loga headers/decisoes de
    # escopo por requisicao - custo de I/O e risco de vazar dado sensivel em
    # log sob alto volume). Para depurar, suba so este pacote via env var, ex.:
    # LOGGING_LEVEL_COM_POC_SIDECAR=DEBUG - sem precisar recompilar/redeploy
    # em builds que leem env var em runtime.
    com.poc.sidecar: INFO
    org.springframework.security: INFO
